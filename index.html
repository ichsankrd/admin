<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Bahan</title>
<style>
:root{--bg:#eef2f1;--surface:#fff;--ink:#16302b;--muted:#5d726d;--line:#cfdad7;--accent:#0f6b5c;--accent-ink:#fff;--warn:#b3402a;--dry:#9a6a14;--wet:#1d6fa5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b19;--surface:#172826;--ink:#e6f1ee;--muted:#93aaa5;--line:#2a403c;--accent:#4fc3ad;--accent-ink:#06201b;--warn:#f08a74;--dry:#e0b25a;--wet:#6cb8ea}}
:root[data-theme="dark"]{--bg:#0f1b19;--surface:#172826;--ink:#e6f1ee;--muted:#93aaa5;--line:#2a403c;--accent:#4fc3ad;--accent-ink:#06201b;--warn:#f08a74;--dry:#e0b25a;--wet:#6cb8ea}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.5}
main{max-width:680px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.9rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px}
form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px}
label{display:grid;gap:4px;font-size:.9rem;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.row{grid-template-columns:1fr}}
button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:11px 16px}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:700}
.err{color:var(--warn);font-size:.9rem;min-height:1.2em;margin:0}
.tabs{display:flex;gap:8px;margin:24px 0 8px;flex-wrap:wrap}
.tab{background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:7px 14px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:.95rem}
th{color:var(--muted);font-weight:600;border-bottom:2px solid var(--ink)}
td.n{font-weight:700}
.jenis{font-weight:700}
.Kering{color:var(--dry)}.Basah{color:var(--wet)}
.del{background:none;color:var(--warn);padding:2px 0;font-size:.85rem}
.empty{color:var(--muted);padding:16px 0}
.count{color:var(--muted);font-size:.9rem;margin:0 0 4px}
.th{width:48px;height:48px;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid var(--line);display:block}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;cursor:zoom-out}
.ov[hidden]{display:none}
.ov img{max-width:100%;max-height:100%;border-radius:6px}
input[type=file]{padding:8px}
.pr{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;margin-top:28px}
.pr h2{margin:0;font-size:1.15rem}
#sheet{display:none}
.kop{display:flex;align-items:center;gap:12px;border-bottom:4px solid #000;padding-bottom:8px;margin-bottom:14px}
.kop img{width:120px;height:auto}
.kop .t{flex:1;text-align:center;font-family:Arial,Helvetica,sans-serif;font-weight:700;line-height:1.35}
.t1{color:#3b7dd8;font-size:13pt}.t2,.t3{font-size:12pt}.t4{font-size:9pt}
.jd{text-align:center;font-weight:700;margin:6px 0 12px}
.meta{margin:0 0 12px 24px;line-height:1.9}.meta b{display:inline-block;width:62px;font-weight:400}
table.s{width:100%;border-collapse:collapse;font-size:10.5pt;min-width:0}
table.s th,table.s td{border:1px solid #000;padding:3px 5px;text-align:center;color:#000;font-size:10.5pt}
table.s td.l{text-align:left}
table.s .y{background:#ffff00}table.s .g{background:#70ad47;color:#fff}table.s .r{background:#ff0000;color:#fff}
table.s .cg{background:#e2efda}table.s .cr{background:#fce4d6}
table.s thead{display:table-header-group}table.s tr{page-break-inside:avoid}
.ttd{margin:26px 0 0 55%;text-align:center;page-break-inside:avoid}.ttd .sp{height:72px}
.rc{font-family:Calibri,Carlito,Arial,Helvetica,sans-serif;font-size:11pt;color:#000;line-height:1.5}
.rc .tg{margin:0 0 6px}.rc .jb{font-weight:700;margin:0 0 14px}
.rc .ph{display:flex;flex-wrap:wrap;gap:3mm;align-items:flex-start}
.rc .ph img{width:5.3cm;max-height:8.5cm;object-fit:contain}
.rc .mh{font-weight:700;margin:22px 0 6px}
.rc .mn{display:grid;grid-template-columns:2.7cm 1fr}
.rc .pg2{break-before:page;page-break-before:always}
/* ===== tampilan layar (responsif) ===== */
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px}
main{max-width:none;margin:0;padding:0}
.top{background:#0f3d36;color:#fff}
.topin{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.topin img{width:44px;height:44px;flex:none;background:#fff;border-radius:50%}
.tt{font-size:1.15rem;font-weight:700;line-height:1.2}
.ts{font-size:.85rem;opacity:.8;line-height:1.3}
.shell{max-width:1240px;margin:0 auto;padding:20px;display:grid;gap:20px;grid-template-columns:minmax(300px,380px) minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"form list" "print list"}
#f{grid-area:form}.listc{grid-area:list;align-self:start}.pr{grid-area:print;align-self:start;margin-top:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 1px 2px rgba(16,40,35,.06)}
.card h2{margin:0;font-size:1.05rem}
#f.card,.pr.card{display:grid;gap:14px}
input,select,textarea{font-size:1rem;padding:11px 12px;min-height:44px}
textarea{min-height:76px;resize:vertical}
button{min-height:44px;border-radius:8px}
.primary:hover{filter:brightness(1.08)}
.lh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.tabs{display:inline-flex;margin:0;gap:2px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.tab{background:transparent;border:0;color:var(--muted);padding:6px 16px;min-height:36px;border-radius:8px}
.tab[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(16,40,35,.18);border:0}
.count{margin:0 0 10px}
table.dt{min-width:560px}
table.dt th{font-size:.82rem;padding:10px 10px;white-space:nowrap}
table.dt td{padding:12px 10px;vertical-align:middle}
table.dt td.c-no{color:var(--muted);width:44px;text-align:center}
.dbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.dbtn{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 14px;min-height:40px}
.cal{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 12px;max-width:340px;background:var(--surface)}
.cal[hidden]{display:none}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700;text-transform:capitalize}
.ch button{background:var(--bg);color:var(--ink);border:1px solid var(--line);min-height:36px;min-width:36px;padding:0;border-radius:8px;font-size:1.2rem;line-height:1}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calg .w{font-size:.75rem;color:var(--muted);padding:4px 0}
.calg button.d{position:relative;min-height:40px;padding:0;border-radius:8px;background:transparent;color:var(--ink);border:1px solid transparent}
.calg button.d.has{font-weight:700;background:var(--bg)}
.calg button.d.has::after{content:"";position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.calg button.d.today{border-color:var(--accent)}
.calg button.d.sel{background:var(--accent);color:var(--accent-ink)}
.calg button.d.sel::after{background:var(--accent-ink)}
.cf{margin-top:10px}
.bk{position:relative;display:inline-block}
.bx{position:absolute;top:-8px;right:-8px;width:26px;height:26px;min-height:26px;min-width:26px;padding:0;border-radius:50%;background:var(--warn);color:#fff;font-size:1rem;line-height:1}
.badd{border:1px dashed var(--line);background:var(--bg);color:var(--ink);padding:6px 12px;min-height:36px;border-radius:8px;font-size:.88rem}
.mth{display:flex;flex-wrap:wrap;gap:10px}.mth:empty{display:none}
.mth .mt{position:relative}
.mth img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;cursor:pointer}
.mth button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;min-height:26px;min-width:26px;padding:0;border-radius:50%;background:var(--warn);color:#fff;font-size:1rem;line-height:1}
.dchip{flex:none;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-height:36px;white-space:nowrap}
.dchip small{opacity:.7;margin-left:6px;font-size:.8rem}
.dchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
table.dt tr.dh td{background:var(--bg);font-weight:700;padding:10px;border-bottom:1px solid var(--line)}
table.dt tr.dh small{color:var(--muted);font-weight:400;margin-left:8px}
table.dt tbody tr.dh:hover{background:var(--bg)}
table.dt tbody tr:hover{background:var(--bg)}
.bd{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.82rem;font-weight:700;border:1px solid currentColor}
.del{border:1px solid var(--line);color:var(--warn);padding:6px 12px;min-height:36px;border-radius:8px}
.del:hover{background:var(--bg)}
.th{width:44px;height:44px}
details.sat{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:12px}details.sat summary{cursor:pointer;font-weight:700}details.sat .row{align-items:end}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 12px;background:var(--bg)}.chip button{background:none;color:var(--warn);min-height:32px;min-width:32px;padding:0;font-size:1.2rem;line-height:1;border-radius:999px}
@media (max-width:960px){
  .shell{max-width:760px;grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"form" "list" "print"}
}
@media (max-width:640px){
  .topin{padding:10px 14px}.shell{padding:14px;gap:14px}.card{padding:16px;border-radius:12px}
  .wrap{overflow:visible}
  table.dt{min-width:0}
  table.dt thead{display:none}
  table.dt,table.dt tbody{display:block}
  table.dt tr{display:grid;grid-template-columns:56px 1fr auto;grid-template-areas:"foto nama jenis" "foto qty qty" "foto tgl del";gap:2px 12px;align-items:center;padding:12px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px}
  table.dt td{display:block;padding:0;border:0}
  table.dt td.c-foto{grid-area:foto;align-self:start}
  table.dt td.c-nama{grid-area:nama;font-size:1.02rem}
  table.dt td.c-jenis{grid-area:jenis;justify-self:end}
  table.dt td.c-qty{grid-area:qty}
  table.dt td.c-no{grid-area:tgl;width:auto;text-align:left;font-size:.88rem}
  table.dt td.c-no::before{content:"No. "}
  table.dt tr.dh{display:block;border:0;padding:4px 2px;margin:6px 0 2px;background:transparent}
  table.dt tr.dh td{background:transparent;padding:0;border:0}
  table.dt td.c-del{grid-area:del;justify-self:end}
  table.dt tr.er{display:block;border:0;padding:0}
  .th{width:56px;height:56px}
  .tabs{width:100%}.tab{flex:1}
  .pr .row{grid-template-columns:1fr}
}
@media print{
  @page{size:A4;margin:0}
  table.pw2{width:100%;min-width:0;border-collapse:collapse}
  table.pw2>thead>tr>td,table.pw2>tfoot>tr>td{height:14mm;border:0;padding:0}
  table.pw2>tbody>tr>td{padding:0 14mm;border:0}
  html,body{background:#fff!important}
  body>main,.ov{display:none!important}
  #sheet{display:block;color:#000;font-family:"Times New Roman",Times,serif;font-size:11pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<main>
<header class="top"><div class="topin"><img id="tl" alt="Logo BGN" width="44" height="44"><div><div class="tt">Catatan Bahan</div><div class="ts">SPPG Karangduak &middot; Penerimaan dan pemeriksaan bahan baku</div></div></div></header>
<div class="shell">
<form id="f" class="card" novalidate>
  <h2>Input bahan</h2>
  <div class="row">
    <label>Tanggal
      <input id="tgl" type="date">
    </label>
    <label>Bahan
      <input id="bahan" type="text" placeholder="Contoh: Tepung terigu" autocomplete="off">
    </label>
  </div>
  <div class="row">
    <label>Banyak
      <input id="banyak" type="number" min="0" step="any" inputmode="decimal" placeholder="5">
    </label>
    <label>Satuan
      <select id="satuan">
        <option>kg</option><option>gram</option><option>liter</option><option>ml</option><option>pcs</option><option>butir</option><option>ikat</option><option>bungkus</option><option>karung</option>
      </select>
    </label>
  </div>
  <label>Jenis
    <select id="jenis"><option>Kering</option><option>Basah</option></select>
  </label>
  <label>Foto bukti (opsional)
    <input id="foto" type="file" accept="image/*">
  </label>
  <p class="err" id="err" role="alert"></p>
  <button class="primary" type="submit">Simpan bahan</button>
  <details class="sat"><summary>Kelola satuan</summary>
    <div class="row"><label>Satuan baru<input id="sbn" type="text" maxlength="20" placeholder="Contoh: ember" autocomplete="off"></label><button class="primary" id="sbt" type="button">Tambah satuan</button></div>
    <div id="schips" class="chips"></div>
    <p class="err" id="smsg" role="status"></p>
  </details>
</form>

<section class="listc card" aria-labelledby="lh">
  <div class="lh"><h2 id="lh">Daftar bahan</h2>
    <div class="tabs" role="group" aria-label="Filter jenis">
      <button class="tab" data-f="Semua" aria-pressed="true" type="button">Semua</button>
      <button class="tab" data-f="Kering" aria-pressed="false" type="button">Kering</button>
      <button class="tab" data-f="Basah" aria-pressed="false" type="button">Basah</button>
    </div>
  </div>
  <div class="dbar">
    <button type="button" class="dbtn" id="dbtn" aria-expanded="false" aria-controls="cal">Tanggal: <b id="dlabel"></b> &#9662;</button>
    <button type="button" class="dchip" id="dall" aria-pressed="false">Semua tanggal</button>
  </div>
  <div class="cal" id="cal" hidden></div>
  <p class="count" id="count"></p>
  <div class="wrap">
  <table class="dt">
    <thead><tr><th>No</th><th>Bahan</th><th>Banyak</th><th>Jenis</th><th>Bukti</th><th></th></tr></thead>
    <tbody id="list"></tbody>
  </table>
  </div>
</section>
<section class="pr card" aria-labelledby="ph">
  <h2 id="ph">Cetak formulir pemeriksaan</h2>
  <div class="row">
    <label>Kepada<input id="pk" type="text" autocomplete="off"></label>
    <label>Alamat<input id="pa" type="text" autocomplete="off"></label>
  </div>
  <div class="row">
    <label>Waktu<input id="pw" type="text" placeholder="Contoh: 07.30 WIB" autocomplete="off"></label>
    <label>Tanggal data<input id="ptgl" type="date"></label>
  </div>
  <label>Nama ahli gizi<input id="pg" type="text" autocomplete="off"></label>
  <label>Menu siswa (diisi per tanggal, tampil di Dokumentasi Menu MBG)<textarea id="pm" rows="2" placeholder="Contoh: nasi putih, bistik ayam, tahu goreng, tumis buncis dan wortel, kurma golden valley"></textarea></label>
  <label>Foto menu siswa (per tanggal, boleh lebih dari satu)<input id="pmf" type="file" accept="image/*" multiple></label>
  <div class="mth" id="pmth"></div>
  <p class="err" id="perr" role="alert"></p>
  <div class="row">
    <button class="primary" id="pbtn" type="button">Cetak formulir</button>
    <button class="primary" id="pbtn2" type="button">Cetak penerimaan (foto)</button>
  </div>
  <details class="sat" open><summary>Simpan ke Supabase</summary>
    <label>URL proyek Supabase<input id="sbu" type="url" placeholder="https://xxxx.supabase.co" autocomplete="off"></label>
    <label>Kunci anon (anon public key)<input id="sbk" type="password" autocomplete="off"></label>
    <div class="row"><button class="primary" id="sbs" type="button">Simpan ke Supabase</button><button class="primary" id="sbl" type="button">Muat dari Supabase</button></div>
    <p class="err" id="sbm" role="status"></p>
  </details>
</section>
</div>
</main>
<div id="sheet"></div>
<input type="file" id="bfile" accept="image/*" hidden>
<div id="ov" class="ov" hidden><img id="ovi" alt="Foto bukti diperbesar"></div>

<script>
(function(){
  var KEY="catatan-bahan-v1", items=[], filter="Semua";
  try{ var raw=localStorage.getItem(KEY); if(raw) items=JSON.parse(raw)||[]; }catch(e){ items=[]; }
  var $=function(id){return document.getElementById(id)};
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(items)); }catch(e){} }
  function esc(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
  function today(){ var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
  function fmtDate(s){ var p=s.split("-"); if(p.length!==3) return s; return new Date(p[0],p[1]-1,p[2]).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}); }
  var assetsNS=null;
  try{ if(window.claude&&claude.use){ claude.use("assets").then(function(a){assetsNS=a;}).catch(function(){}); } }catch(e){}
  function shrink(file){ return new Promise(function(res,rej){
    var img=new Image(), u=URL.createObjectURL(file);
    img.onload=function(){ var s=Math.min(1,1000/Math.max(img.width,img.height)), c=document.createElement("canvas");
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u);
      c.toBlob(function(b){ b?res(b):rej(); },"image/jpeg",.75); };
    img.onerror=function(){ URL.revokeObjectURL(u); rej(); }; img.src=u; }); }
  function toData(b){ return new Promise(function(res){ var r=new FileReader(); r.onload=function(){res(r.result)}; r.readAsDataURL(b); }); }
  async function makeFoto(file){ var b=await shrink(file);
    if(assetsNS){ try{ var r=await assetsNS.upload(b); return {id:r.id}; }catch(e){} }
    return {data:await toData(b)}; }
  function fotoSrc(f){ return f ? (f.id ? "/_blob/"+f.id : f.data) : ""; }
  function thumb(it,i){
    var s=fotoSrc(it.foto);
    if(!s) return '<button type="button" class="badd" data-i="'+i+'">+ Foto</button>';
    return '<span class="bk"><img class="th" src="'+esc(s)+'" alt="Foto bukti '+esc(it.bahan)+'" data-src="'+esc(s)+'"><button type="button" class="bx" data-i="'+i+'" aria-label="Hapus foto '+esc(it.bahan)+'">&times;</button></span>';
  }
  function dropFoto(it){ try{ if(it&&it.foto&&it.foto.id&&assetsNS) assetsNS.delete(it.foto.id).catch(function(){}); }catch(e){} }
